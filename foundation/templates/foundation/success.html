<!DOCTYPE html>
<html>
<head>
    <title>Donation Successful</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .success-box {
            background: white;
            width: 90%;
            max-width: 500px;
            padding: 50px 30px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .check {
            font-size: 70px;
            margin-bottom: 10px;
        }

        h1 {
            color: #d89b00;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            font-size: 18px;
            line-height: 1.6;
        }

        .home-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: #d89b00;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .home-btn:hover {
            background: #b77f00;
        }
    </style>
</head>

<body>

    <div class="success-box">

        <div class="check">✅</div>

        <h1>Donation Successful!</h1>

        <p>
            Thank you for supporting
            <strong>Halal Islamic Charity Foundation</strong>.
        </p>

        <p>
            Your contribution can help us support people
            and communities in need.
        </p>

        <a href="/" class="home-btn">Return Home</a>

    </div>

</body>
</html>
