{% extends "foundation/base.html" %}
{% block title %}Reset Password | Halal Islamic Charity Foundation{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 480px;">
    <h2 class="section-title mb-4">Reset Your Password</h2>
    <p>Enter your email address and we'll send you instructions to reset your password.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.email }}
        <button type="submit" class="btn mt-3" style="background-color:#c9922c; color:#fff;">Send Reset Link</button>
    </form>
</div>
{% endblock %}
